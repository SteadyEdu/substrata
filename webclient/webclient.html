<!doctype html>
<html lang="en-us">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<title>Substrata Web Client</title>
		
		<style>
		#canvas {
			width:100%;
			height:100dvh; /* percentage of viewport height.  See https://www.frontend.fyi/tutorials/finally-a-fix-for-100vh-on-mobile */
			border: none;
			display: block; /* Needed to get rid of 4 pixel region under the canvas */
			background-color: transparent;
			
			position: absolute;
			top: 0;
			left: 0;
		}
		body {
			margin: 0;
			padding: 0;
		}
		#status {
			font-family: 'Arial', sans-serif;
			font-size: 1.5em;
			color: rgb(150, 150, 150); /* font colour */
			margin-left: auto;
			margin-right: auto;
			margin-top: 100px;
			padding: 20px;
			width: 30%;
			border: 2px solid rgb(150, 150, 150);
		}

		.background-div {
			width:100%;
			height:100dvh; /* percentage of viewport height.  See https://www.frontend.fyi/tutorials/finally-a-fix-for-100vh-on-mobile */
			border: none;
			display: block; /* Needed to get rid of 4 pixel region under the canvas */
			
			z-index: -1;
			/*z-index: -1;*/ /* TEMP WAS -1*/
			/*background-color: grey;*/
			position: absolute;
			top: 0;
			left: 0;
			
			overflow: hidden;
		}
		
		#iframe-container {
			border: solid red;
			transform-origin: top left;
			transform: translate3d(500px, 100px, 714px) scale3d(1, -1, 1) translate3d(0px, -400px, 0) scale3d(400, 400, 400) translate3d(0px, 0px, -2px) translate3d(0px, 1px, 0px) scale3d(1, -1, 1) scale3d(0.0025, 0.0025, 0.0025);
			
			/* model to world and world to cam */ 
			/*perspective:  500px;*/

			/*translate3d(0, 0, -2)*/
 
			width:  400px;
			height: 400px;
			background-color: green;
			font-size: 30px;
		}
		
		.transformable-html-view {
			/*border: solid red;*/
			transform-origin: top left;
			background-color: grey;
			width:  1024px;
			height: 576px;
			position: absolute; /* to prevent second and later divs being offset downwards */
			
			/*z-index: -1;*/
		}
		
		#iframe-container-camera {
			perspective:  714px;
			transform-style: preserve-3d; /* To make objects occlude each other properly in 3d */
			width:100%;
			height:100dvh; /* percentage of viewport height.  See https://www.frontend.fyi/tutorials/finally-a-fix-for-100vh-on-mobile */
		}

		#file-picker {
			visibility: hidden;
			position: absolute;
			z-index: -2;
			margin-left: 100px;
			margin-top: 100px;
			background-color: white;
			padding: 20px;
			line-height: 1.6;
			font-size: 18px;
			color: #222;
			font-family: Helvetica;
			margin-bottom: 40px;
		}

		#file-picker-form {
		}

		#file-picker-close-button {
			float: right;
			cursor: pointer;
			border-color: #959595;
			border-width: 1px;
			border-style: solid;
			width: 26px;
			height: 26px;
			align-items: center;
			justify-content: center;
			display: flex;
		}

		</style>
	</head>
	<body>
		<div id="status">downloading...</div>

		<div class="background-div" id="background-div">
			<div id="iframe-container-camera">
			</div>
		</div>

		<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>

		<div class="file-picker" id="file-picker">
			<div id="file-picker-close-button">&times;</div>
			<h3 id="file-picker-header">Select File</h3>
			<form action="/file_picker_post" id="file-picker-form" method="post">
				<label for="file-input">Choose a file:</label>
				<br/>
				<input type="file" id="file-input" name="file-input"/>
				<br/>
				<button type="submit">Submit</button>
			</form>
		</div>

	<script type='text/javascript'>

		isNode = false; // To fix runtime error with new Emscripten

		var statusElement = document.getElementById('status');

		var Module = {
			print: (function() {})(),
			canvas: (() => {
				var canvas = document.getElementById('canvas');

				// As a default initial behavior, pop up an alert when webgl context is lost. To make your
				// application robust, you may want to override this behavior before shipping!
				// See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
				canvas.addEventListener("webglcontextlost", (e) => { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);

				return canvas;
			})(),
			setStatus: (text) => {
				//console.log("~~~~~~~setStatus: " + text + "~~~~~~~~~");
				statusElement.innerText = text;
			},
			totalDependencies: 0,
			monitorRunDependencies: (left) => {
				Module.totalDependencies = Math.max(Module.totalDependencies, left);
				Module.setStatus(left ? 'Preparing... (' + (Module.totalDependencies - left) + '/' + Module.totalDependencies + ')' : 'All downloads complete.');
			},
			calledRun: false,
			onRuntimeInitialized: () => {
				//console.log("~~~~~~~~~~~~~~~~ onRuntimeInitialized() ~~~~~~~~~~");
				statusElement.style.display = 'none';
			},
			locateFile: function (path, prefix) {
				// Update URLs with cache-busting suffixes
				//console.log("locateFile(): path: " + path + ", prefix: " + prefix)
				let suffix = ""
				if (path === "gui_client.data") {
					prefix = "/webclient/"; // make work if page is /visit/parcel/xx, which otherwise would request /visit/parcel/gui_client.data
					suffix = "?hash=GUI_CLIENT_DATA_HASH";
				}
				else if (path == "gui_client.wasm") {
					suffix = "?hash=GUI_CLIENT_WASM_HASH";
				}
				//console.log("Using suffix '" + suffix + "'");
				//console.log("returning path '" + prefix + path + suffix + "'...");
				return prefix + path + suffix;
			}
		};

		Module.setStatus('Downloading...');

		window.onerror = (message, source, lineno, colno, error) => {
			Module.setStatus('Exception thrown: ' + message);

			Module.setStatus = (text) => {
				if (text) console.error('[post-exception status] ' + text);
			};
		};


		var next_html_view_elem_handle = 1;
		var html_view_elem_handle_to_div_map = {};
		var youtube_iframe_API_ready = false;

		function onYouTubeIframeAPIReady() {
			console.log("****************onYouTubeIframeAPIReady()*************************");
			youtube_iframe_API_ready = true;
		}

		var move_background_timer_id = null;
		
		let background_div = document.getElementById('background-div');
		background_div.addEventListener('mousedown', function(e) {
			console.log("background mousedown event, moving background back to background...");
			background_div.style.zIndex = -1; 
		});


		//------------------------------------File picker widget code-----------------------------------
		let last_pick_type_id = -1;
		function showFilePickerWidget(caption, accept_string, pick_type_id) {
			let file_picker_div = document.getElementById('file-picker');
			file_picker_div.style.visibility = "visible";
			file_picker_div.style.zIndex = 200; 

			document.getElementById('file-picker-header').innerHTML = caption;

			document.getElementById('file-input').accept = accept_string;

			last_pick_type_id = pick_type_id;
		}

		function hideFilePickerWidget() {
			let file_picker_div = document.getElementById('file-picker');
			file_picker_div.style.visibility = "hidden";
			file_picker_div.style.zIndex = -2; 
		}

		const file_picker_form = document.getElementById('file-picker-form');

		file_picker_form.addEventListener('submit', async (e) => {
			e.preventDefault(); // Prevent default form submission
			
			const formData = new FormData(file_picker_form);
			
			for (let [key, value] of formData.entries()) {
				if(key === "file-input") {
					console.assert(value instanceof File);
					const array_buffer = await value.arrayBuffer();
					const uint8Array = new Uint8Array(array_buffer);

					// Allocate memory in Emscripten heap
					const dataPtr = Module._malloc(uint8Array.length);
					Module.HEAPU8.set(uint8Array, dataPtr);

					// Call C++ function with pointer
					Module.ccall('processFilePickerFile',
						'null', // return type
						['number', 'number', 'string', 'number'],   // argument types
						[dataPtr, uint8Array.length, value.name, last_pick_type_id]);// arguments
				
					// Clean up memory
					Module._free(dataPtr);
				}
			}
			
			hideFilePickerWidget();
		});
		
		const file_picker_close_button = document.getElementById('file-picker-close-button');
		
		file_picker_close_button.addEventListener('click', function(e) {
			hideFilePickerWidget();
		});
		
	</script>

	<script async type="text/javascript" src="/webclient/gui_client.js?hash=GUI_CLIENT_JS_HASH"></script>


	<!-- Frame timing overlay.  Does nothing unless the URL carries ?fps=1.

	     It samples requestAnimationFrame on the main thread, the callback the client renders from (see
	     emscripten_set_main_loop in SDLClient.cpp), so it reports the cadence the client actually achieves.

	     Two things to know when reading it.  The average saturates at the display refresh rate, so an average
	     sitting on the cap says the client is keeping up and nothing about how much room is left - the
	     over-budget and worst-frame figures are the ones that carry information.  And requestAnimationFrame
	     stops when the page is hidden, which on a headset means whenever it is taken off or the panel is
	     backgrounded.  Resuming then looks exactly like one enormous frame, so those gaps are detected and
	     counted separately rather than being reported as stalls.

	     ?scale=N additionally renders at N times the canvas size.  The point is to find where the frame rate
	     leaves the refresh cap, since that is the only way to measure headroom on a display that caps it. -->
	<script type="text/javascript">
	(function() {
		var search = window.location.search;
		if(!/[?&]fps=1(?:&|$)/.test(search))
			return;

		var WARMUP_S  = 3.0;    // Skip load and first-frame hitching.
		var GAP_MS    = 500.0;  // A frame longer than this is a paused page, not a slow one.
		// 72 Hz, the Quest's refresh.  Note this is only meaningful when the refresh cap is above it: on a
		// 60 Hz display every frame is 16.7 ms and so "over budget" by definition, which is why the hitch
		// count below exists as well - that one is relative to the run's own median and so cap-independent.
		var budget_match = /[?&]budget=([0-9.]+)/.exec(search);
		var BUDGET_MS = budget_match ? parseFloat(budget_match[1]) : 13.9;

		var scale_match = /[?&]scale=([0-9.]+)/.exec(search);
		var scale = scale_match ? parseFloat(scale_match[1]) : 1.0;
		if(!(scale > 0)) scale = 1.0;

		var canvas = document.getElementById('canvas');

		if(scale !== 1.0 && canvas) {
			// Grow the canvas past the window and let SDL pick the new size up through its resize path.  The
			// canvas is clipped by the viewport, but the pixels are really rendered, which is the point.
			var applyScale = function() {
				canvas.style.width  = (window.innerWidth  * scale) + 'px';
				canvas.style.height = (window.innerHeight * scale) + 'px';
				window.dispatchEvent(new Event('resize'));
			};
			applyScale();
			setInterval(applyScale, 2000); // The client resets the canvas on its own resizes, so reassert.
		}

		var box = document.createElement('div');
		box.style.cssText =
			'position:fixed;top:8px;left:8px;z-index:100000;pointer-events:none;' +
			'font:16px/1.45 monospace;white-space:pre;color:#fff;' +
			'background:rgba(0,0,0,0.72);padding:8px 12px;border-radius:6px;';
		box.textContent = 'frame timing: sampling...';
		document.body.appendChild(box);

		var start        = performance.now();
		var prev         = start;
		var last_report  = start;
		var frames       = [];   // Frame durations in ms since the last display update.
		var worst_ms     = 0;    // Worst genuine frame since warmup, gaps excluded.
		var total_frames = 0;
		var over_budget  = 0;
		var hitches      = 0;    // Frames well over the run's own median, i.e. visible stutter.
		var gap_count    = 0;
		var gap_total_ms = 0;
		var skip_next    = false;

		document.addEventListener('visibilitychange', function() {
			// Whatever delta spans the hidden period is not a rendered frame.
			skip_next = true;
		});

		function pct(sorted, p) {
			if(sorted.length === 0) return 0;
			return sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * p))];
		}

		function sample(now) {
			var dt = now - prev;
			prev = now;
			var elapsed_s = (now - start) / 1000;

			var is_gap = skip_next || (dt > GAP_MS);
			skip_next = false;

			if(is_gap) {
				if(elapsed_s > WARMUP_S) { gap_count++; gap_total_ms += dt; }
			}
			else if(elapsed_s > WARMUP_S) {
				frames.push(dt);
				total_frames++;
				if(dt > worst_ms)   worst_ms = dt;
				if(dt > BUDGET_MS)  over_budget++;
			}

			if((now - last_report) >= 1000) {
				var window_s = (now - last_report) / 1000;
				last_report = now;

				if(frames.length > 0) {
					var sorted = frames.slice().sort(function(a, b) { return a - b; });

					// A hitch is a frame well clear of what this run normally manages.  Measuring against the
					// run's own median rather than a fixed budget means it still detects stutter on a display
					// whose refresh cap already sits above the budget.
					var median = pct(sorted, 0.50);
					for(var i=0; i<frames.length; ++i)
						if(frames[i] > (median * 1.5)) hitches++;

					box.textContent = [
						'fps           ' + (frames.length / window_s).toFixed(1),
						'median        ' + pct(sorted, 0.50).toFixed(1) + ' ms',
						'p95           ' + pct(sorted, 0.95).toFixed(1) + ' ms',
						'worst (1s)    ' + sorted[sorted.length - 1].toFixed(1) + ' ms',
						'worst (all)   ' + worst_ms.toFixed(1) + ' ms',
						'over ' + BUDGET_MS + 'ms   ' +
							((100 * over_budget) / Math.max(1, total_frames)).toFixed(1) + '%',
						'hitches       ' + hitches + '  (' +
							((100 * hitches) / Math.max(1, total_frames)).toFixed(2) + '%)',
						'paused        ' + gap_count + 'x, ' + (gap_total_ms / 1000).toFixed(1) + ' s',
						timingLines(),
						xrLines(),
						xrConfigLine(),
						xrErrorLines(),
						'canvas        ' + canvasSize() + (scale !== 1 ? '  (scale ' + scale + ')' : ''),
						'dpr           ' + (window.devicePixelRatio || 1),
						'frames        ' + total_frames,
						'elapsed       ' + elapsed_s.toFixed(0) + ' s'
					].filter(function(s){ return s; }).join('\n');
				}
				frames.length = 0;
			}

			requestAnimationFrame(sample);
		}

		// Published once a second by the client (publishFrameTimings in SDLClient.cpp).  "cpu" is everything
		// before the draw and "gl" is the draw itself, so a cpu figure that does not move with resolution is
		// the signature of a cost no amount of resolution reduction will remove.
		function timingLines() {
			var t = window.__substrata_frame_timings;
			if(!t) return 'cpu/gl        (not reported yet)';
			return 'cpu           ' + t.cpu_ms.toFixed(2) + ' ms\n' +
			       'gl draw       ' + t.gl_ms.toFixed(2) + ' ms\n' +
			       'client fps    ' + t.client_fps.toFixed(1);
		}

		// Published by the client during a WebXR session.  A headset is no place to read an overlay, so the
		// numbers are kept and shown on the flat page once the session ends.
		function xrLines() {
			var x = window.__substrata_xr;
			if(!x) return null;
			return 'xr ' + (x.active ? 'live      ' : 'last run  ') + x.fps.toFixed(1) + ' fps\n' +
			       'xr frames     ' + x.frames + '\n' +
			       'xr views      ' + x.views + '\n' +
			       'xr buffer     ' + x.fb_w + 'x' + x.fb_h +
			       (x.views > 1 ? '  (' + Math.round(x.fb_w / x.views) + 'x' + x.fb_h + ' an eye)' : '');
		}

		// What was asked of the session, as opposed to what came back.  Set once when the session starts.
		function xrConfigLine() {
			var c = window.__substrata_xr_cfg;
			if(!c) return null;
			return 'xr scale     ' + c.scale.toFixed(2) +
			       (c.requested ? '  asked ' + c.requested + ' Hz' : '') +
			       (c.rates.length ? '  offers ' + c.rates.join('/') : '');
		}

		// Whatever went wrong inside the session, shown once the headset is off.
		function xrErrorLines() {
			var e = window.__substrata_xr_error;
			var c = window.__substrata_xr_counts;
			var out = [];
			if(c) out.push('xr calls     ' + c.frames + ' frames, ' + c.drawn + ' drawn, ' + c.noPose + ' no pose');
			if(window.__substrata_xr_debug) out.push('xr where     ' + window.__substrata_xr_debug);
			if(e) out.push('xr ERROR     ' + e);
			return out.length ? out.join('\n') : null;
		}

		function canvasSize() {
			var c = canvas || document.querySelector('canvas');
			return c ? (c.width + 'x' + c.height) : 'no canvas';
		}

		requestAnimationFrame(sample);
	})();
	</script>


	<!-- WebXR session.  Phase one of the scope in ROADMAP.md: start a session, run its frame loop, end cleanly.
	     Nothing of the world is drawn yet - the client clears the session's framebuffer to a moving colour, which
	     is the smallest thing that shows the whole chain is live from inside the headset.

	     The session lives here rather than in C++ because it can only be started from a user gesture and because
	     Emscripten has no WebXR bindings.  The one piece that has to cross over is the framebuffer: Emscripten
	     addresses GL objects by integer name through a table of its own, and WebXR hands out a JavaScript
	     object, so the object is registered in that table and the name passed across. -->
	<script type="text/javascript">
	(function() {
		var xrButton = null;
		var xrSession = null;
		var xrRefSpace = null;

		function setStatus(text, enabled) {
			if(!xrButton) return;
			xrButton.textContent = text;
			xrButton.disabled = !enabled;
			xrButton.style.opacity = enabled ? '1' : '0.5';
		}

		function makeButton() {
			var b = document.createElement('button');
			b.textContent = 'Enter VR';
			b.style.cssText =
				'position:fixed;right:16px;bottom:16px;z-index:100001;' +
				'font:600 16px system-ui,sans-serif;color:#fff;background:#1a56db;' +
				'border:0;border-radius:8px;padding:12px 20px;cursor:pointer;';
			b.addEventListener('click', onClick);
			document.body.appendChild(b);
			return b;
		}

		function onClick() {
			if(xrSession)
				xrSession.end();  // The 'end' event does the tidying up, however the session ends.
			else
				enterVR();
		}

		async function enterVR() {
			setStatus('Starting...', false);
			try {
				var canvas = document.getElementById('canvas');
				var gl = canvas.getContext('webgl2');
				if(!gl) throw new Error('no WebGL2 context');

				// The context was created by SDL without knowing about XR.  This can migrate it to the adapter
				// driving the headset, which on some devices means losing and restoring it.
				await gl.makeXRCompatible();

				var session = await navigator.xr.requestSession('immersive-vr');

				// Hold on to it immediately.  Everything below can fail, and a session that has been granted but
				// not recorded is one nobody can end: it stays live with no frame loop driving it, which in a
				// headset is a black world with no way out short of reloading the page.
				xrSession = session;
				session.addEventListener('end', onSessionEnded);

				// ?xrscale=N asks the runtime for a framebuffer N times the native linear resolution.  This is
				// the main lever on cost: the frame's pixel count goes as the square of it, and at native
				// resolution this scene does not come close to the frame budget.
				var search = window.location.search;
				var scaleMatch = /[?&]xrscale=([0-9.]+)/.exec(search);
				var fbScale = scaleMatch ? parseFloat(scaleMatch[1]) : 1.0;

				// The layer is antialiased by default, which makes its framebuffer multisampled - extra cost we
				// have not budgeted for, and one more difference between the session's framebuffer and an
				// ordinary one.  Off unless ?xraa=1 asks for it.
				var layerOpts = { antialias: /[?&]xraa=1(?:&|$)/.test(search) };
				if(fbScale !== 1.0 && fbScale > 0)
					layerOpts.framebufferScaleFactor = fbScale;

				var layer = new XRWebGLLayer(session, gl, layerOpts);
				await session.updateRenderState({ baseLayer: layer });

				// ?xrrate=N asks for a refresh rate.  Dropping from 90 Hz to 72 buys 2.8 ms a frame, which at
				// the measured cost is worth roughly twice the pixels - usually a better trade in a classroom
				// than the extra smoothness.
				var rateMatch = /[?&]xrrate=([0-9.]+)/.exec(search);
				var wantRate = rateMatch ? parseFloat(rateMatch[1]) : 0;
				var rates = session.supportedFrameRates ? Array.from(session.supportedFrameRates) : [];
				// Deliberately not awaited.  On a Quest this promise can simply never settle, and awaiting it hangs
				// the rest of the setup - leaving a session that has been granted but never driven, which is a
				// black headset.  The rate is a preference, not something to block on.
				if(wantRate && session.updateTargetFrameRate && rates.indexOf(wantRate) !== -1) {
					try {
						var ratePromise = session.updateTargetFrameRate(wantRate);
						if(ratePromise && ratePromise.catch) ratePromise.catch(function(e){ console.warn('WebXR: frame rate refused', wantRate, e); });
					}
					catch(e) { console.warn('WebXR: could not ask for frame rate', wantRate, e); }
				}

				// Kept apart from the statistics the client publishes, which it overwrites each frame.
				window.__substrata_xr_cfg = { rates: rates, requested: wantRate || null, scale: fbScale };

				// local-floor puts the origin on the floor, which is what a room-scale scene wants.  Not every
				// device offers it, so fall back to local, whose origin is wherever the head started.
				try       { xrRefSpace = await session.requestReferenceSpace('local-floor'); }
				catch(e)  { xrRefSpace = await session.requestReferenceSpace('local'); }

				if(!layer.framebuffer)
					throw new Error('session gave no framebuffer');

				// Introduce the framebuffer to Emscripten's GL object table, and hand C++ the integer name.
				var GL = Module.GL;
				if(!GL || !GL.framebuffers)
					throw new Error("Emscripten's GL table is not exported - build with EXPORTED_RUNTIME_METHODS=GL");
				var fbName = GL.getNewId(GL.framebuffers);
				layer.framebuffer.name = fbName;
				GL.framebuffers[fbName] = layer.framebuffer;

				if(typeof Module._xrViewBuffer !== 'function')
					throw new Error('_xrViewBuffer is not exported - the frame loop cannot pass views to the client');
				if(!Module.HEAPF32)
					throw new Error('HEAPF32 is not exported - the frame loop cannot write into wasm memory');

				window.__substrata_xr_error = null;
				Module._xrSessionStarted(fbName, layer.framebufferWidth, layer.framebufferHeight);
				setStatus('Exit VR', true);

				session.requestAnimationFrame(onXRFrame);
			}
			catch(err) {
				console.error('WebXR: could not start a session:', err);
				window.__substrata_xr_error = 'starting a session: ' + (err && err.message ? err.message : String(err));
				setStatus('VR failed - see console', true);

				// End it rather than leave it live and undriven.
				if(xrSession) { try { xrSession.end(); } catch(e) {} }
				xrSession = null;
				xrRefSpace = null;
			}
		}

		var xrCounts = { frames: 0, noPose: 0, drawn: 0 };

		function onXRFrame(time, frame) {
			var session = frame.session;
			session.requestAnimationFrame(onXRFrame);
			xrCounts.frames++;

			// Anything thrown here is invisible from inside a headset, and leaves the framebuffer untouched -
			// which looks exactly like a black world.  Record it where the flat page can show it afterwards.
			try {
				drawXRFrame(frame, session);
			}
			catch(err) {
				window.__substrata_xr_error = 'frame: ' + (err && err.message ? err.message : String(err));
				console.error('WebXR frame failed:', err);
			}
			window.__substrata_xr_counts = xrCounts;
		}

		function drawXRFrame(frame, session) {
			// A pose can be missing for a frame or two, when tracking has not settled or the headset is off the
			// face.  Skipping those is normal and not an error.
			var pose = frame.getViewerPose(xrRefSpace);
			if(!pose) { xrCounts.noPose++; Module._xrFrame(0); return; }

			// Write each view straight into wasm memory rather than passing forty numbers across the boundary
			// ninety times a second: sixteen floats of projection, sixteen of world-to-view, four of viewport.
			var layer = session.renderState.baseLayer;
			var base = Module._xrViewBuffer() >> 2;
			var heap = Module.HEAPF32;
			var views = pose.views;
			var n = Math.min(views.length, 4);

			for(var i = 0; i < n; ++i) {
				var view = views[i];
				var o = base + i * 36;
				heap.set(view.projectionMatrix, o);
				heap.set(view.transform.inverse.matrix, o + 16);

				var vp = layer.getViewport(view);
				heap[o + 32] = vp.x;
				heap[o + 33] = vp.y;
				heap[o + 34] = vp.width;
				heap[o + 35] = vp.height;
			}

			xrCounts.drawn++;
			Module._xrFrame(n);
		}

		function onSessionEnded() {
			if(xrSession) xrSession.removeEventListener('end', onSessionEnded);
			xrSession = null;
			xrRefSpace = null;
			Module._xrSessionEnded();
			setStatus('Enter VR', true);
		}

		function init() {
			if(!navigator.xr) return; // Not an XR browser: no button, nothing to explain.

			navigator.xr.isSessionSupported('immersive-vr').then(function(supported) {
				if(!supported) return;
				xrButton = makeButton();
			}).catch(function(){ /* Treated as unsupported. */ });
		}

		// Wait for the wasm module, since the button calls straight into it.
		if(window.Module && Module.calledRun) init();
		else {
			var prev = window.Module ? Module.onRuntimeInitialized : null;
			Module.onRuntimeInitialized = function() { if(prev) prev(); init(); };
		}
	})();
	</script>


	<!-- A failure inside a WebXR session, shown whether or not the frame timing overlay was asked for.
	     Diagnostics that only appear when a debug flag happens to be in the URL are diagnostics that will be
	     missing on the run that needed them, which is how a session error went unseen for a whole round here. -->
	<script type="text/javascript">
	(function() {
		var box = null;
		setInterval(function() {
			var e = window.__substrata_xr_error;
			if(!e) return;
			if(!box) {
				box = document.createElement('div');
				box.style.cssText =
					'position:fixed;left:8px;bottom:8px;right:8px;z-index:100002;pointer-events:none;' +
					'font:13px/1.4 monospace;white-space:pre-wrap;color:#fff;' +
					'background:rgba(140,20,20,0.92);padding:8px 12px;border-radius:6px;';
				document.body.appendChild(box);
			}
			var c = window.__substrata_xr_counts;
			box.textContent = 'WebXR: ' + e + (c ? ('\n' + c.frames + ' frames, ' + c.drawn + ' drawn, ' + c.noPose + ' no pose') : '');
		}, 500);
	})();
	</script>
